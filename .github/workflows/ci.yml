# SPDX-License-Identifier: GPL-3.0-or-later
# Continuous checks (section 21.6): every push and pull request builds the compiler,
# runs the conformance corpus with GCC and Clang, and runs a short fuzzing campaign.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: corpus (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Install OCaml, dune and the C compiler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ocaml-nox ocaml-dune ${{ matrix.cc }}
      - name: Build
        run: dune build
      - name: Conformance corpus
        # each program on the reference interpreter and the debug and release C
        # builds, golden error codes, test blocks with rejection tests, and the
        # fuzzer's own checks (tests/fuzz/selftest.sh)
        run: tests/run.sh
      - name: Constant stack
        # a million-element list through functions that must run as loops (tests/deep.sh)
        run: tests/deep.sh

  portable:
    name: portable (byte-wise and big-endian)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install OCaml, dune, a cross compiler for s390x and qemu
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ocaml-nox ocaml-dune gcc gcc-s390x-linux-gnu libc6-dev-s390x-cross qemu-user-static
      - name: Build
        run: dune build
      - name: String tests on the byte-wise paths and on a big-endian target
        # the Str layout has fast paths for little-endian targets; every other target, and
        # this build of it, takes the byte-wise ones (tests/portable.sh)
        env:
          REQUIRE_BIG_ENDIAN: 1
        run: tests/portable.sh

  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install OCaml and dune
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ocaml-nox ocaml-dune gcc
      - name: Build
        run: dune build
      - name: Differential and negative fuzzing
        # each program runs on the interpreter and the C build, and then one mutation of it
        # with a known violation must be rejected with the code of the rule it breaks.
        # The fuzzer picks a random seed on every run, reruns included, and prints it
        # first; a failing case is reported by number and can be replayed with:
        #   dune exec tests/fuzz/fuzz.exe -- --seed <case> --count 1
        # The first three failures are shrunk: caseN.min.stn (or caseN.neg.min.stn for a
        # mutation) next to the program that failed.
        # the step's limit is below the job's, so failing programs are still uploaded
        # when repeated hangs (120 s each) use up the time
        timeout-minutes: 20
        run: ./_build/default/tests/fuzz/fuzz.exe --count 500 --shrink --keep fuzz-failures
      - name: Crash fuzzing
        # the bytes of each program are changed, and the compiler must not crash on what is left
        timeout-minutes: 10
        run: ./_build/default/tests/fuzz/fuzz.exe --crash --count 300 --shrink --keep fuzz-failures
      - name: Keep failing programs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: fuzz-failures/
          if-no-files-found: ignore
